name: Release swap

# Manually-triggered release of the `swap` backend module. Delegates the
# build / verify / publish pipeline to the shared
# logos-co/logos-modules-release-action reusable workflow — the same
# tested path every module in the official catalog uses. Mirrors the
# caller convention of logos-co/logos-modules-v2 (e.g.
# release-logos-wallet-module.yml), with `module_path` pointing at our
# in-repo subdirectory instead of a submodule.
#
# Source of truth for module name + version is swap-module/metadata.json
# (read by the upstream action) — upstream convention: no version input
# here; bump metadata.json and dispatch.
#
# Publishes GitHub release `swap-v<version>` on THIS repo carrying the
# .lgx + sidecar.json, then fires the `rebuild-index` repository_dispatch
# so rebuild-index.yml regenerates the rolling `index` release.

on:
  workflow_dispatch: {}

# Shared with release-swap-ui.yml and release-on-merge.yml so a manual dispatch
# cannot run concurrently with a merge-triggered release and have both write the
# same tag and assets. See release-on-merge.yml for the full rationale.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    permissions:
      contents: write
    with:
      module_path: swap-module
      # All three variants the upstream matrix supports (issue #32). The
      # logos-blockchain-circuits and rapidsnark fixed-output hashes are now
      # pinned for x86_64-linux / aarch64-linux in swap-module/flake.nix, so
      # the Linux legs resolve instead of falling back to fakeSha256.
      # Spelled out rather than left to the upstream default so a change to
      # that default cannot silently alter what we publish. Intel macOS is
      # absent on purpose — upstream ships no macos-x86_64 circuits bundle.
      # The upstream matrix is fail-fast: false, so a leg that does break
      # yields a partial release rather than losing the variants that built.
      variants: "darwin-arm64,linux-amd64,linux-arm64"
      # signing_mode defaults to "none" (unsigned .lgx). Switch to
      # inline/external here when a signing key exists.
