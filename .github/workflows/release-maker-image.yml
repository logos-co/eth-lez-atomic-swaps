name: Release maker image

# Publishes the maker liquidity-bot container (Dockerfile at repo root:
# swap-cli maker --loop + the offer-publisher sidecar) to GHCR on tag push.
#
# This is the repo's FIRST CI artifact for the CLI — every other release
# workflow here (release-swap.yml, release-swap-ui.yml) publishes a Basecamp
# module (.lgx) via the shared logos-modules-release-action pipeline. The
# maker image has no Basecamp/module concept (it's a headless server
# process, not a desktop module), so it gets its own plain
# docker/build-push-action workflow instead of that reusable pipeline.
#
# Trigger: push a tag matching `maker-v*` (e.g. `maker-v0.1.0`). Deliberately
# separate from the module tags (`swap-v*`, `swap_ui-v*`) so cutting a maker
# image release never collides with — or gets mistaken for — a module
# release.

on:
  push:
    tags:
      - "maker-v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build + push (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-maker
          # This workflow only ever runs against a `maker-v*` tag (or a
          # manual workflow_dispatch, which may target any ref) — never a
          # plain semver ref — so `type=semver` never matches and neither
          # `is_default_branch` (a tag push isn't the default branch) nor a
          # plain `type=raw,value=latest` (would fire on a dispatch off any
          # branch/tag) is safe. Rules below:
          #   1. type=match extracts the clean semver (`0.4.4`) from the
          #      `maker-v0.4.4` tag name.
          #   2. type=ref,event=tag reproduces the tag verbatim
          #      (`maker-v0.4.4`) for provenance.
          #   3. type=sha keeps the existing short-sha fallback tag.
          #   4. type=raw,value=latest is gated on the ref literally being a
          #      `maker-v*` tag, so `:latest` can only land on a real
          #      release build — never a workflow_dispatch off a branch (or
          #      an unrelated tag).
          tags: |
            type=match,pattern=maker-v(\d+\.\d+\.\d+),group=1
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/maker-v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
