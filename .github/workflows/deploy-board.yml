name: Deploy offer board to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/offer-board/**"
      - ".github/workflows/deploy-board.yml"
  workflow_dispatch:

# Least privilege at the workflow level: the build job runs `npm ci` on
# third-party code and must not hold Pages/OIDC deploy credentials. Pages
# write + id-token are granted only to the deploy job below (P2-4).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/offer-board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/offer-board/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/offer-board/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
