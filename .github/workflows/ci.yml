name: CI

# PR-time compile and runtime coverage. Two jobs:
#
#   rust-checks  — proves the Rust workspace (incl. the swap-ffi cdylib the
#                  Basecamp module wraps) still compiles and its unit tests
#                  pass, without the risc0 guest toolchain.
#   basecamp-ui-runtime — installs the portable delivery/swap/swap_ui packages
#                         into an isolated profile and drives them inside the
#                         real pinned Basecamp bundle, headlessly.
#
# Deliberately out of scope: a funded two-peer swap (covered by the manual
# Basecamp run and headless demo), macOS accessibility semantics, the risc0
# guest build (`demo` feature), localnet integration tests, and releases.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# OPTING OUT
#   Add the `skip-ci` label to a pull request and every job here is skipped.
#   Intended for changes that cannot affect what these jobs prove — a README
#   edit, a comment-only pass. It is a deliberate, visible act: the label sits
#   on the PR for a reviewer to see, and removing it re-runs everything.
#
#   `labeled`/`unlabeled` are listed under `types:` for exactly that reason.
#   The default pull_request types are opened/synchronize/reopened, so without
#   them the label would only take effect on a PR that already carried it
#   before its last push — silently doing nothing the rest of the time.
#
#   The guard is written so it can only ever be false on a pull_request:
#   `github.event.pull_request` is null on a push to master, so the label list
#   is empty, contains() is false, and the job runs. Merging to master is
#   therefore never skippable, whatever the PR was labelled.

jobs:
  rust-checks:
    name: rust-checks (cargo check + unit tests)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # risc0-build (3.0.5 in Cargo.lock) skips the guest build entirely when
      # RISC0_SKIP_BUILD is non-empty and emits stub method constants instead,
      # so neither the rzup toolchain nor a nested guest cargo build is needed.
      # The guest methods crate is reached via the root package's
      # dev-dependency on lez_htlc_methods, so `cargo test` needs this even
      # without the `demo` feature.
      RISC0_SKIP_BUILD: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Validate public-feedback evidence boundary
        run: node tests/check-feedback-evidence.mjs

      # Installs the toolchain pinned in rust-toolchain.toml (1.93.0).
      # Must run before rust-cache so the cache key sees the right rustc.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Would have caught #49: PR #40 changed maker FFI signatures on master
      # and swap-ffi was never rebuilt during review.
      # NOTE: build scripts of the LEZ dependency tree download prebuilt
      # circuit / rapidsnark artifacts at compile time (network required);
      # that is the normal non-nix dev flow.
      - name: cargo check swap-ffi
        run: cargo check -p swap-ffi --locked

      # Workspace unit tests (swap-orchestrator, swap-ffi, lez-mcp lib
      # targets). --lib keeps the localnet integration tests (which need a
      # scaffold LEZ sequencer, and are #[ignore]d) out of scope.
      - name: cargo test (lib targets)
        run: cargo test --lib --locked

      # Foundry gives us `forge` (to produce contracts/out/EthHTLC.sol, which
      # the artifact-backed sol! macros read at COMPILE time) and `anvil` (the
      # local chain the two suites below drive).
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: verify protocol-v2 EIP-712 fixture
        run: scripts/verify-protocol-v2-fixture.sh

      - name: forge build (ABI artifacts for the sol! macros)
        run: cd contracts && forge build

      - name: forge test (contract invariants)
        run: cd contracts && forge test

      # The anvil-backed suites. These need no LEZ sequencer, so unlike
      # tests/e2e_swap.rs they can gate every PR — and they are what stops a
      # silent ABI/binding regression:
      #
      #   taker_binding  — the taker's LEZ account must survive intact from its
      #                    own ETH lock, through the Locked log and the watcher
      #                    decode, into the LEZ Lock instruction's taker_id.
      #                    A maker that loses it locks funds nobody can claim.
      #   eth_integration — lock/claim/refund, the Locked event's
      #                    takerLezAccount round trip, swapId distinctness for
      #                    one hashlock, and the INTERFACE_VERSION handshake.
      - name: cargo test (anvil integration)
        run: cargo test --locked --test taker_binding --test eth_integration

  basecamp-ui-runtime:
    name: basecamp-ui-runtime (real Basecamp, linux-amd64)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # Pull unchanged deps (risc0, Qt, the liblogos chains) from the shared
          # binary cache instead of rebuilding them, mirroring canary.yml's
          # `modules` job. Reads are public — no token. The URL + key are repo
          # variables (docs/nix-cache.md); when they are unset the two lines
          # expand empty and nix-installer ignores them, so this is safe on forks
          # that lack the vars. (Previously these two lines were mis-indented
          # under the failure-diagnostics upload step's `retention-days`, so they
          # were folded into that scalar and the cache pull never applied.)
          extra-conf: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.NIX_CACHE_URL }}
            extra-trusted-public-keys = ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The portable Basecamp bundle carries its Qt stack, but Qt's Linux
      # platform support still loads the system OpenGL ABI at process start.
      # ubuntu-latest does not include libOpenGL.so.0 by default.
      - name: Install Basecamp system runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libglx0 libopengl0

      - name: Install modules and run Basecamp-native UI smoke test
        run: make basecamp-ui-smoke

      - name: Upload Basecamp failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: basecamp-ui-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/basecamp-ui-smoke/
          if-no-files-found: warn
          retention-days: 14
