<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LEZ / ETH Offer Board</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #21262d;
      --text: #e6e8eb;
      --text-dim: #8b949e;
      --accent: #4cc38a;
      --warn: #e5b567;
      --err: #e5534b;
      --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 20px 28px 14px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 17px; font-weight: 600; letter-spacing: .01em; }
    header .topic { color: var(--text-dim); font-family: var(--mono); font-size: 12px; }
    #status {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
    }
    #status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-dim);
    }
    #status.connected .dot { background: var(--accent); }
    #status.connecting .dot { background: var(--warn); animation: pulse 1.2s infinite; }
    #status.blocked .dot, #status.error .dot { background: var(--err); }
    @keyframes pulse { 50% { opacity: .35; } }
    main { flex: 1; padding: 20px 28px; max-width: 1100px; width: 100%; margin: 0 auto; }
    #notice {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--warn);
      border-radius: 6px;
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 14px;
      color: var(--text-dim);
      display: none;
    }
    #notice code { font-family: var(--mono); font-size: 12px; color: var(--text); }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-dim);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      vertical-align: top;
    }
    td.mono { font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); }
    tr.offer td:first-child { font-weight: 600; }
    .amount { font-family: var(--mono); font-size: 13px; }
    .give { color: var(--accent); }
    .fresh { color: var(--accent); }
    .stale { color: var(--warn); }
    #empty {
      text-align: center;
      color: var(--text-dim);
      padding: 60px 0 40px;
      font-size: 14px;
    }
    footer {
      padding: 14px 28px;
      border-top: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 12px;
      display: flex;
      gap: 18px;
    }
    footer span { font-family: var(--mono); }
  </style>
</head>
<body>
  <header>
    <h1>LEZ / ETH Offer Board</h1>
    <span class="topic">/atomic-swaps/1/offers/json &middot; logos.dev &middot; cluster 2</span>
    <span id="status" class="connecting"><span class="dot"></span><span id="status-text">starting&hellip;</span></span>
  </header>
  <main>
    <div id="notice"></div>
    <table>
      <thead>
        <tr>
          <th>Pair</th>
          <th>Maker gives</th>
          <th>Maker wants</th>
          <th>Timelocks (LEZ / ETH)</th>
          <th>Maker</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody id="offers"></tbody>
    </table>
    <div id="empty">No live offers. Offers appear here while a maker heartbeat is publishing.</div>
  </main>
  <footer>
    <div>peers <span id="peer-count">0</span></div>
    <div>offers seen <span id="seen-count">0</span></div>
    <div>offers expire after <span id="ttl-label"></span> without a heartbeat</div>
  </footer>
  <script src="./config.js"></script>
  <script src="./app.bundle.js"></script>
</body>
</html>
