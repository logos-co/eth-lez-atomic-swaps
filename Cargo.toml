[workspace]
members = [".", "swap-ffi"]
resolver = "2"

[package]
name = "swap-orchestrator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "swap-cli"
path = "src/bin/cli.rs"

[dependencies]
# Ethereum
alloy = { version = "1", features = [
    "provider-ws",
    "signer-local",
    "contract",
    "sol-types",
    "network",
    "rpc-types",
    "node-bindings",
] }
futures-util = "0.3"

# LEZ — pinned to v0.2.0-rc5, the exact tag the public testnet
# (https://testnet.lez.logos.co) runs. Do NOT bump to v0.2.0 final until the
# testnet does: builtin program ImageIDs changed in final and are computed
# client-side, so a final-pinned client's transfers get rejected by an rc5
# sequencer. When the testnet upgrades, bumping these six tags is the only
# change needed (wire encodings are otherwise compatible).
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0-rc5" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0-rc5", features = ["host"] }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0-rc5" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0-rc5" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0-rc5", features = ["client"] }
sequencer_service_protocol = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0-rc5" }
# LEZ HTLC types (HTLCInstruction, HTLCEscrow, HTLCState)
lez_htlc_program = { path = "programs/lez-htlc/methods/guest" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }

# Crypto
sha2 = "0.10"
rand = { version = "0.8", features = ["std", "std_rng"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Environment
dotenvy = "0.15"

# URL parsing
url = "2"

# Utilities
base58 = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "1.5"

# Demo-only dependencies (behind `demo` feature flag)
lez_htlc_methods = { path = "programs/lez-htlc/methods", optional = true }

[features]
default = []
demo = [
    "dep:lez_htlc_methods",
    "alloy/provider-anvil-node",
]

[dev-dependencies]
alloy = { version = "1", features = [
    "provider-ws",
    "signer-local",
    "contract",
    "sol-types",
    "network",
    "rpc-types",
    "node-bindings",
    "provider-anvil-node",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }

lez_htlc_methods = { path = "programs/lez-htlc/methods" }
serial_test = "3"
