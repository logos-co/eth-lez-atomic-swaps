[workspace]
members = [".", "swap-ffi", "lez-mcp"]
resolver = "2"

[package]
name = "swap-orchestrator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "swap-cli"
path = "src/bin/cli.rs"

[dependencies]
# Ethereum
alloy = { version = "1", features = [
    "provider-ws",
    "signer-local",
    "contract",
    "sol-types",
    "network",
    "rpc-types",
    "node-bindings",
] }
futures-util = "0.3"

# LEZ — pinned to v0.2.0 (final), the exact version the public testnet
# (https://testnet.lez.logos.co) runs: all five builtin program ImageIDs
# reported by its getProgramIds RPC match the v0.2.0 artifacts bit-for-bit
# (verified 2026-07-21). Builtin IDs are computed client-side from embedded
# ELFs, so this pin MUST track the deployed sequencer version exactly.
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0", features = ["host"] }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0", features = ["client"] }
sequencer_service_protocol = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0" }
# Builtin program registry (authenticated_transfer & co. moved here in v0.2.0)
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0", features = ["artifacts"] }
authenticated_transfer_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0" }
# Pinata (faucet) system account id — same repo, same tag. Needed for the
# native faucet claim (src/lez/faucet.rs); no `wallet` binary required.
system_accounts = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.0" }
# LEZ HTLC types (HTLCInstruction, HTLCEscrow, HTLCState)
lez_htlc_program = { path = "programs/lez-htlc/methods/guest" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "process"] }

# Crypto
sha2 = "0.10"
rand = { version = "0.8", features = ["std", "std_rng"] }
# CSPRNG for native LEZ account creation (src/lez/onboard.rs) — same crate/
# version lez-mcp already uses for preview tokens.
getrandom = "0.2"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Environment
dotenvy = "0.15"

# URL parsing
url = "2"

# Utilities
base58 = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "1.5"

# Demo-only dependencies (behind `demo` feature flag)
lez_htlc_methods = { path = "programs/lez-htlc/methods", optional = true }

[features]
default = []
demo = [
    "dep:lez_htlc_methods",
    "alloy/provider-anvil-node",
]

[dev-dependencies]
alloy = { version = "1", features = [
    "provider-ws",
    "signer-local",
    "contract",
    "sol-types",
    "network",
    "rpc-types",
    "node-bindings",
    "provider-anvil-node",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }

lez_htlc_methods = { path = "programs/lez-htlc/methods" }
serial_test = "3"
