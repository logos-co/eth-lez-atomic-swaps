[workspace]
members = [".", "swap-ffi", "lez-mcp", "eth-faucet-pow", "eth-faucet"]
resolver = "2"

[package]
name = "swap-orchestrator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "swap-cli"
path = "src/bin/cli.rs"

[dependencies]
# Ethereum
alloy = { version = "1", features = [
    "provider-ws",
    "signer-local",
    "contract",
    "sol-types",
    "network",
    "rpc-types",
    "node-bindings",
] }
futures-util = "0.3"

# LEZ — pinned to v0.2.2 (commit d6e4ae69), the exact version the public
# testnet (https://testnet.lez.logos.co) runs after its 2026-08-06 reset +
# upgrade: all five builtin program ImageIDs reported by its getProgramIds RPC
# match the v0.2.2 artifacts bit-for-bit (verified 2026-08-06 via a live
# fingerprint probe). Builtin IDs are computed client-side from embedded ELFs,
# so this pin MUST track the deployed sequencer version exactly — v0.2.0
# clients' txs are silently dropped by the v0.2.2 sequencer.
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.2" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.2", features = ["host"] }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.2" }
# Optional (behind `scaffold-wallet`): at v0.2.2 the upstream wallet crate
# unconditionally pulls keycard_wallet → keycard-rs → pcsc-sys, which needs
# system libpcsclite on Linux — a dependency CI runners and the sandboxed nix
# module build don't have (and upstream exposes no feature flag to shed it).
# Only the scaffold-localnet flows (demo/infra + the localnet e2e tests) read
# the scaffold wallet, so the dep stays off by default and rides the `demo`
# feature.
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.2", optional = true }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.2", features = ["client"] }
sequencer_service_protocol = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.2" }
# Builtin program registry (authenticated_transfer & co. moved here in v0.2.0)
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.2", features = ["artifacts"] }
authenticated_transfer_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.2" }
# Pinata (faucet) system account id — same repo, same tag. Needed for the
# native faucet claim (src/lez/faucet.rs); no `wallet` binary required.
system_accounts = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.2.2" }
# LEZ HTLC types (HTLCInstruction, HTLCEscrow, HTLCState)
lez_htlc_program = { path = "programs/lez-htlc/methods/guest" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "process"] }

# Crypto
sha2 = "0.10"
rand = { version = "0.8", features = ["std", "std_rng"] }
# CSPRNG for native LEZ account creation (src/lez/onboard.rs) — same crate/
# version lez-mcp already uses for preview tokens.
getrandom = "0.2"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Environment
dotenvy = "0.15"

# URL parsing
url = "2"

# Utilities
base58 = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = "1.5"

# Demo-only dependencies (behind `demo` feature flag)
lez_htlc_methods = { path = "programs/lez-htlc/methods", optional = true }

[features]
default = []
# Scaffold-managed wallet support (WalletCore readers in src/scaffold.rs and
# the wallet-auth paths). Off by default: the v0.2.2 wallet crate hard-requires
# system libpcsclite on Linux via keycard (see the `wallet` dep comment).
# Builds without it still support raw-key auth everywhere; wallet-auth paths
# return a clear runtime error pointing at this feature.
scaffold-wallet = ["dep:wallet"]
demo = [
    "dep:lez_htlc_methods",
    "alloy/provider-anvil-node",
    # demo/infra drive the scaffold localnet through the scaffold wallet.
    "scaffold-wallet",
]

# The localnet e2e tests read the scaffold wallet; keep them out of
# default-feature `--all-targets` builds (CI runs default features with no
# libpcsclite installed).
[[test]]
name = "e2e_swap"
required-features = ["scaffold-wallet"]

[[test]]
name = "lez_integration"
required-features = ["scaffold-wallet"]

[dev-dependencies]
alloy = { version = "1", features = [
    "provider-ws",
    "signer-local",
    "contract",
    "sol-types",
    "network",
    "rpc-types",
    "node-bindings",
    "provider-anvil-node",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }

lez_htlc_methods = { path = "programs/lez-htlc/methods" }
serial_test = "3"
