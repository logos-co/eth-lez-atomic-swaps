# Maker liquidity-bot: `swap-cli maker --loop` + offer-publisher sidecar.
# See README.md in this directory for the full deploy runbook.

services:
  maker:
    # Both `image` and `build` are active on purpose: `docker compose build`
    # builds from source and tags the result with this same name, so
    # `docker compose up -d` works identically whether the image was just
    # built on this host or pulled from GHCR (`docker compose pull`) once
    # .github/workflows/release-maker-image.yml has published a tag there.
    # No manual comment/uncomment dance needed for the first build-on-host
    # deploy vs. later registry-pull deploys.
    image: ghcr.io/logos-co/eth-lez-atomic-swaps-maker:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: eth-lez-maker
    restart: unless-stopped
    env_file:
      - maker.env
    volumes:
      # Named volume, NOT a bind mount into a repo checkout: .maker-state.json
      # (the crash-recovery journal) and the status file must survive image
      # upgrades / container recreation, which is the whole point of not
      # running this as a bare `cargo run` on the host.
      - maker-state:/app/state
      # Overlay the repo's offer-publisher source on the image's baked copies
      # (node_modules stays from the image). fleet.mjs pins the current fleet
      # cluster/peers (was previously hot-patched by hand in-container — see
      # docker-compose.multi.yml header); publish-offer.mjs + rfq.mjs ship the
      # RFQ on-demand responder (feat/rfq-on-demand-offers) without an image
      # rebuild. publish-offer.mjs imports "./fleet.mjs", "./heartbeat.mjs" and
      # "./rfq.mjs", all resolved by these mounts.
      - ../offer-publisher/fleet.mjs:/app/offer-publisher/fleet.mjs:ro
      - ../offer-publisher/heartbeat.mjs:/app/offer-publisher/heartbeat.mjs:ro
      - ../offer-publisher/publish-offer.mjs:/app/offer-publisher/publish-offer.mjs:ro
      - ../offer-publisher/rfq.mjs:/app/offer-publisher/rfq.mjs:ro
    # No ports published: the maker only makes outbound connections (Sepolia
    # RPC, LEZ sequencer RPC, the waku fleet over TCP) — nothing listens.
    healthcheck:
      # `swap-cli maker --status` reads the periodic health snapshot
      # (`MAKER_STATUS_FILE`, rewritten every ~15s by the running loop) and
      # asserts on it — e.g. fails when the last CONFIRMED offer publish is
      # older than 3x the heartbeat, or when the offer-publisher sidecar is
      # dead. This replaced a bare `pgrep` liveness check (issue #93): a
      # process that is merely alive but wedged on an RPC call, or whose
      # offer-publisher sidecar died, looked identical to "working" under
      # that check and to this one it does not.
      test: ["CMD-SHELL", "swap-cli maker --status"]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  maker-state:
