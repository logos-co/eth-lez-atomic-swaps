[scaffold]
version = "0.2.0"
cache_root = ".scaffold/lez-cache"

[repos.lez]
source = "git@github.com:logos-blockchain/logos-execution-zone.git"
pin = "d6e4ae694e7419f5906b340c232704466a1917b7"
path = ".scaffold/lez-cache/repos/lez/d6e4ae694e7419f5906b340c232704466a1917b7"

[repos.spel]
source = "https://github.com/logos-co/spel.git"
pin = "3d639076ec0946a6a6db799dd5a4648007f362ee"

[repos.basecamp]
source = "https://github.com/logos-co/logos-basecamp.git"
pin = "aa237766baf61404e12da86b7303cb41065464c9"
build = "nix-flake"
attr = { aarch64-darwin = "bin-macos-app", aarch64-linux = "bin-appimage", x86_64-darwin = "bin-macos-app", x86_64-linux = "bin-appimage" }

[repos.lgpm]
source = "github:logos-co/logos-package-manager"
pin = "202af6fa0f0f4493bc59c8a609dff9326f78a18d"
build = "nix-flake"
attr = "cli-portable"

# >= v0.2.0 is REQUIRED for the migrated logos.dev fleet (Waku cluster 3):
# v0.1.x parses a flat `clusterId` but its bundled logos-delivery (509c8755,
# waku/factory/conf_builder/waku_conf_builder.nim:313-324) unconditionally
# overwrites it with the preset's cluster 2 — the node lands on the dead
# cluster and no offers arrive. v0.2.0's logos-delivery (f8b03659) flips the
# merge order (checkSetPresetValueToField, waku_conf_builder.nim:355-389):
# an explicit clusterId wins and only the gaps are preset-filled.
[modules.delivery_module]
flake = "github:logos-co/logos-delivery-module/v0.2.0#lgx"
role = "dependency"

[modules.swap]
flake = "git+file:.?dir=swap-module#lgx"
role = "project"

[modules.swap_ui]
flake = "git+file:.?dir=swap-ui#lgx"
role = "project"

[wallet]
home_dir = ".scaffold/wallet"

[framework]
kind = "default"
version = "0.1.0"

[framework.idl]
spec = "lssa-idl/0.1.0"
path = "idl"

[localnet]
port = 3040
risc0_dev_mode = true

[circuits]
version = "0.4.2"

[basecamp.profiles.maker]
env_file = ".env"
runtime_dir = "/tmp/lgs-maker"
log_file = ".scaffold/basecamp/profiles/maker/basecamp.log"

[basecamp.profiles.maker.env]
SWAP_UI_AUTO_ENV_FILE = ".env"
SWAP_UI_AUTO_ROLE = "maker"

[basecamp.profiles.taker]
env_file = ".env.taker"
runtime_dir = "/tmp/lgs-taker"
log_file = ".scaffold/basecamp/profiles/taker/basecamp.log"

[basecamp.profiles.taker.env]
SWAP_UI_AUTO_ENV_FILE = ".env.taker"
SWAP_UI_AUTO_ROLE = "taker"

[run.profiles.demo]
deploy = false
post_deploy = "LEE_WALLET_HOME_DIR=.scaffold/wallet cargo run --features demo -- demo --no-localnet"

[run.profiles.test]
deploy = false
post_deploy = "LEE_WALLET_HOME_DIR=.scaffold/wallet cargo test"
