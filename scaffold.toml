[scaffold]
version = "0.2.0"
cache_root = ".scaffold/lez-cache"

[repos.lez]
source = "git@github.com:logos-blockchain/logos-execution-zone.git"
pin = "9fa541f3d1cfa2d4415b7c3cf4cd8954a83b78c7"
path = ".scaffold/lez-cache/repos/lez/9fa541f3d1cfa2d4415b7c3cf4cd8954a83b78c7"

[repos.spel]
source = "https://github.com/logos-co/spel.git"
pin = "3d639076ec0946a6a6db799dd5a4648007f362ee"

[repos.basecamp]
source = "https://github.com/logos-co/logos-basecamp.git"
pin = "a746cdbc521f72ee22c5a4856fd17a9802bb9d69"
build = "nix-flake"
attr = { aarch64-darwin = "bin-macos-app", aarch64-linux = "bin-appimage", x86_64-darwin = "bin-macos-app", x86_64-linux = "bin-appimage" }

[repos.lgpm]
source = "github:logos-co/logos-package-manager"
pin = "e5c25989861f4487c3dc8c7b3bc0062bcbc3221f"
build = "nix-flake"
attr = "cli-portable"

[modules.delivery_module]
flake = "github:logos-co/logos-delivery-module/v0.1.1#lgx"
role = "dependency"

[modules.swap]
flake = "git+file:.?dir=swap-module#lgx"
role = "project"

[modules.swap_ui]
flake = "git+file:.?dir=swap-ui#lgx"
role = "project"

[wallet]
home_dir = ".scaffold/wallet"

[framework]
kind = "default"
version = "0.1.0"

[framework.idl]
spec = "lssa-idl/0.1.0"
path = "idl"

[localnet]
port = 3040
risc0_dev_mode = true

[circuits]
version = "0.4.2"

[basecamp.profiles.maker]
env_file = ".env"
runtime_dir = "/tmp/lgs-maker"
log_file = ".scaffold/basecamp/profiles/maker/basecamp.log"

[basecamp.profiles.maker.env]
SWAP_UI_AUTO_ENV_FILE = ".env"
SWAP_UI_AUTO_ROLE = "maker"
LOGOS_DATA_DIR = ".scaffold/basecamp/profiles/maker/xdg-data/Logos/LogosBasecamp"

[basecamp.profiles.taker]
env_file = ".env.taker"
runtime_dir = "/tmp/lgs-taker"
log_file = ".scaffold/basecamp/profiles/taker/basecamp.log"

[basecamp.profiles.taker.env]
SWAP_UI_AUTO_ENV_FILE = ".env.taker"
SWAP_UI_AUTO_ROLE = "taker"
LOGOS_DATA_DIR = ".scaffold/basecamp/profiles/taker/xdg-data/Logos/LogosBasecamp"

[run.profiles.demo]
post_deploy = "cargo run --features demo -- demo --no-localnet"

[run.profiles.test]
post_deploy = "cargo test"
