[package]
name = "swap-ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
swap-orchestrator = { path = "..", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
base58 = "0.2"
alloy = { version = "1", features = ["signers", "signer-local", "providers"] }
alloy-primitives = "1"
dotenvy = "0.15"
sha2 = "0.10"
rand = { version = "0.8", features = ["std", "std_rng"] }

# Demo-only: compiles in the deterministic LEZ HTLC risc0 image ID so the UI can
# surface the canonical program ID (see swap_ffi_default_lez_htlc_program_id).
# Gated behind `demo` because building the guest requires the risc0 toolchain.
lez_htlc_methods = { path = "../programs/lez-htlc/methods", optional = true }

[build-dependencies]
cbindgen = "0.27"

[features]
default = []
demo = ["dep:lez_htlc_methods"]
